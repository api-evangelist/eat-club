aid: eat-club
name: EAT Club
description: >-
  EAT Club is a corporate meal-delivery platform founded in 2010 in Redwood City, California
  by Kevin Yang and Rodrigo Santibanez, built around the idea of a "virtual cafeteria" for
  offices with no on-site dining. Instead of tray-style catering, each employee picks an
  individually packaged meal from a rotating daily menu produced by EAT Club's own kitchens
  and restaurant partners, and every order for a building arrives in one synchronized
  delivery. The company markets the program as an employee lunch benefit and reports 21
  million meals delivered to roughly 1,145 companies across nine cities. Compass Group USA
  acquired EAT Club in October 2020 and folded its ordering, production and delivery
  technology into Compass Digital Labs, where it now underpins workplace, education and
  healthcare dining accounts across the US and Canada. The consumer-facing product is a
  React ordering app served from www.eatclub.com; EAT Club publishes no developer program,
  no API reference, no SDK and no machine-readable contract of any kind.
