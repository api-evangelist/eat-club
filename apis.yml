  detail: >-
    EAT Club ships only an end-user ordering product: every developer-shaped host
    (api., developer., developers., docs., app., portal., admin.eatclub.com) is NXDOMAIN,
    all seven /.well-known/ paths and every spec path on www.eatclub.com return the
    application's own 404 page, and the sole JSON surface — the undocumented,
    session-authenticated backend of the "aphrodite" ordering SPA at
    https://www.eatclub.com/api/v3/ — rejects unauthenticated calls with
    "Unauthenticated user with no location in session" and has no reference, no key
    issuance and no terms covering programmatic access, so there is no developer program
    to profile.
